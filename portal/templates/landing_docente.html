<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Naruto-WiFi — Docente</title>
<style>
body{font-family:sans-serif;max-width:420px;margin:20px auto;padding:20px;background:#f4f4f4}
.card{background:white;padding:24px;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.1)}
h2{margin:0 0 12px;color:#27ae60}
.role{background:#27ae60;color:white;padding:4px 10px;border-radius:12px;font-size:12px;text-transform:uppercase}
.timer{font-size:28px;color:#e67e22;font-weight:bold;text-align:center;margin:16px 0}
.resources{background:#e8f8f5;border-left:4px solid #27ae60;padding:14px;margin:12px 0;border-radius:4px}
.resources h3{margin:0 0 10px;color:#0e6251;font-size:15px}
.resources a{display:block;padding:8px;margin:4px 0;background:white;color:#27ae60;text-decoration:none;border-radius:4px;border:1px solid #27ae60;font-size:14px}
.resources a:hover{background:#27ae60;color:white}
.btn{display:block;text-align:center;margin-top:16px;padding:12px;background:#27ae60;color:white;text-decoration:none;border-radius:4px}
</style>
</head>
<body>
<div class="card">
<h2>Bienvenido, Prof. {{ user }} <span class="role">{{ role }}</span></h2>
<p>Acceso a la red académica con recursos docentes.</p>
<div class="timer">⏱ <span id="t">{{ remaining }}</span> s</div>
<div class="resources">
  <h3>🎓 Recursos internos</h3>
  <a href="#">📋 Portal de calificaciones</a>
  <a href="#">📚 Biblioteca digital</a>
  <a href="#">📅 Calendario académico</a>
  <a href="#">💬 Foro de docentes</a>
</div>
<a href="http://www.google.com" class="btn">Ir a Internet</a>
</div>
<script>
let n = {{ remaining }};
setInterval(() => { if (n>0) document.getElementById('t').textContent = --n; }, 1000);
</script>
</body>
</html>
