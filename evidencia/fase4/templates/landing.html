<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Naruto-WiFi — Conectado</title>
<style>
body{font-family:sans-serif;max-width:420px;margin:20px auto;padding:20px;background:#f4f4f4}
.card{background:white;padding:24px;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.1);text-align:center}
.ok{color:#27ae60;font-size:64px;line-height:1}
h2{margin:16px 0 8px}
.role{background:#3498db;color:white;padding:4px 10px;border-radius:12px;font-size:12px;text-transform:uppercase}
.timer{font-size:32px;color:#e67e22;font-weight:bold;margin:16px 0}
.label{color:#666;font-size:14px;margin:4px 0}
.btn{display:inline-block;margin-top:16px;padding:12px 24px;background:#27ae60;color:white;text-decoration:none;border-radius:4px;font-size:16px}
</style>
</head>
<body>
<div class="card">
<div class="ok">✓</div>
<h2>¡Conectado!</h2>
<p>Hola <strong>{{ user }}</strong> <span class="role">{{ role }}</span></p>
<p class="label">Ya tienes acceso a Internet</p>
<div class="label">Tiempo restante de sesión:</div>
<div class="timer"><span id="t">{{ remaining }}</span> s</div>
<a href="http://www.google.com" class="btn">Ir a Internet</a>
</div>
<script>
let n = {{ remaining }};
const el = document.getElementById('t');
setInterval(() => {
  if (n > 0) {
    n--;
    const h = Math.floor(n/3600);
    const m = Math.floor((n%3600)/60);
    const s = n%60;
    el.textContent = h > 0 ? `${h}h ${m}m ${s}s` : `${m}m ${s}s`;
  } else {
    el.textContent = 'Expirada';
  }
}, 1000);
</script>
</body>
</html>
