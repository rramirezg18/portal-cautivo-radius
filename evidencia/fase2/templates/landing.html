<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Naruto-WiFi — Conectado</title>
<style>
body{font-family:sans-serif;max-width:420px;margin:40px auto;padding:20px;background:#f4f4f4}
.card{background:white;padding:24px;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.1)}
.ok{color:#27ae60;font-size:48px;text-align:center}
.timer{font-size:28px;text-align:center;color:#e67e22;font-weight:bold}
.role{background:#3498db;color:white;padding:4px 8px;border-radius:4px;font-size:12px}
</style>
</head>
<body>
<div class="card">
<div class="ok">✔</div>
<h2>Hola, {{ user }} <span class="role">{{ role }}</span></h2>
<p>Ya tienes acceso a Internet.</p>
<p>Tiempo restante de sesión:</p>
<div class="timer"><span id="t">{{ remaining }}</span> s</div>
</div>
<script>
let n = {{ remaining }};
setInterval(() => {
  if (n > 0) { n--; document.getElementById('t').textContent = n; }
  else { document.getElementById('t').textContent = 'Expirada'; }
}, 1000);
</script>
</body>
</html>
